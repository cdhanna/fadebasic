<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fade WebRuntime.MonoGame — Standalone</title>
    <base href="./" />
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>

    <!-- Splash visible until Blazor mounts and replaces #mg-blazor-root's contents. -->
    <div id="app">
        <div class="boot-splash">
            <div>loading WebRuntime.MonoGame…</div>
            <div class="boot-splash-sub">Standalone test: a color-clear canvas means KNI + Game1 are alive. Use the browser console to call <code>window.theInstance.invokeMethodAsync('LoadProgram', source)</code> to run a Fade program.</div>
        </div>
    </div>

    <!-- Blazor mounts WebRuntime.MonoGame.App into this div (selector in Program.cs).
         A separate root from #app keeps the boot splash visible until Blazor
         takes over, and avoids collision when this runtime is loaded inline
         into the Playground page (which uses its own #app). -->
    <div id="mg-blazor-root"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        // Boot Blazor manually so we can hook before/after the runtime starts.
        Blazor.start();
    </script>

    <!--
        KNI's Wasm JS shims. These are static web assets shipped by the
        nkast.Wasm.* packages (transitive deps of nkast.Kni.Platform.Blazor.GL).
        At publish time, `dotnet publish` copies them into wwwroot/_content/.

        Version suffix must match the package's static-web-asset version. If
        KNI bumps its Wasm dependency we'll see 404s here — `ls bin/Release/net8.0/publish/wwwroot/_content/nkast.Wasm.*/js/`
        to discover the new version, then update suffixes below.
    -->
    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.8.0.11.js"></script>

    <script>
        // ── Watchdog ─────────────────────────────────────────────────────────
        // If a single TickDotNet() call blocks JS this long, the .NET side gets
        // OnGameTimedOut() and we expect _game to be nulled. Matches XnaFiddle's
        // posture; leniency is intentional so first-boot Initialize()/LoadContent()
        // don't false-positive.
        const WATCHDOG_FRAME_MS = 5000;

        // ── rAF tick loop ────────────────────────────────────────────────────
        // .NET does NOT own the game loop. JS does. Per frame:
        //   1. Sync canvas drawing-buffer to its container's pixel size.
        //   2. Notify .NET of any size change via OnCanvasResized.
        //   3. Call TickDotNet() — one Game.Tick() (Update + Draw).
        //   4. If the tick exceeded WATCHDOG_FRAME_MS, call OnGameTimedOut so
        //      .NET drops its game reference. Subsequent ticks become no-ops.
        function tickJS(timestamp) {
            const canvas = document.getElementById('theCanvas');
            const holder = document.getElementById('canvasHolder');
            if (canvas && holder && window.theInstance) {
                const w = holder.clientWidth;
                const h = holder.clientHeight;
                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w;
                    canvas.height = h;
                    window.theInstance.invokeMethod('OnCanvasResized', w, h);
                }

                const tickStart = performance.now();
                window.theInstance.invokeMethod('TickDotNet');
                const tickMs = performance.now() - tickStart;

                if (tickMs > WATCHDOG_FRAME_MS) {
                    window.theInstance.invokeMethod('OnGameTimedOut', tickMs);
                }
            }
            window.requestAnimationFrame(tickJS);
        }

        // ── Blazor internal-API shims (load-bearing, fragile) ───────────────
        // KNI's JS expects two things that aren't part of Blazor's public API:
        //   1. globalThis.Module — the Emscripten module object. Blazor 8+
        //      stopped exposing it at the top level; we re-route from
        //      Blazor.runtime.Module.
        //   2. Blazor.platform.getArrayLength — removed in newer Blazor.
        //      Polyfill via HEAP32 read of the array-header length slot.
        //
        // If a future Blazor moves either of these, this function will throw
        // with a clear message instead of failing silently inside KNI.
        function applyBlazorKniShims() {
            if (!globalThis.Module) {
                if (!Blazor.runtime?.Module) {
                    throw new Error('[WebRuntime.MonoGame] Blazor.runtime.Module not available. ' +
                        'Blazor internal API may have changed; update the Module shim in index.html.');
                }
                globalThis.Module = Blazor.runtime.Module;
            }
            if (typeof Blazor.platform.getArrayLength !== 'function') {
                Object.assign(Blazor.platform, {
                    getArrayLength: function (arr) {
                        const arrPtr = Blazor.platform.getArrayEntryPtr(arr, 0, 4);
                        return Module.HEAP32[(arrPtr - 4) >> 2];
                    }
                });
            }
        }

        // ── Entry point from .NET ───────────────────────────────────────────
        // Pages/Index.razor.cs's OnAfterRender(firstRender:true) calls this via
        // IJSRuntime.InvokeVoidAsync("initRenderJS", dotNetRef). We store the
        // ref so tickJS can call back into .NET, apply the Blazor shims, set
        // up the canvas, and start the rAF loop.
        window.initRenderJS = function (instance) {
            applyBlazorKniShims();
            window.theInstance = instance;

            // Hide the boot splash now that KNI + Game1 are alive. The Blazor
            // mount lives in a separate #mg-blazor-root so the splash sat
            // alongside until this moment — fade it out so the canvas shows.
            const splash = document.getElementById('app');
            if (splash) splash.style.display = 'none';

            const canvas = document.getElementById('theCanvas');
            const holder = document.getElementById('canvasHolder');
            if (!canvas || !holder) {
                console.error('[WebRuntime.MonoGame] canvas/holder missing — Index.razor markup did not render.');
                return;
            }

            canvas.width = holder.clientWidth;
            canvas.height = holder.clientHeight;
            // Disable browser context menu so right-click is available to the game.
            canvas.addEventListener('contextmenu', e => e.preventDefault());

            window.requestAnimationFrame(tickJS);
        };
    </script>

</body>

</html>
