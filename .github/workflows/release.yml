name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        type: string
        description: Commit hash to deploy
        default: main
      majorSemver:
        type: number
        description: major number in semver 
        required: true
        default: 0
      minorSemver:
        type: number
        description: minor number in semver 
        required: true
        default: 0
      patchSemver:
        type: number
        description: patch number in semver 
        required: true
        default: 0
      publishVsCode:
        type: boolean
        description: publish the vs code extension?
        required: true
        default: true
      publishNuget:
        type: boolean
        description: publish the nuget packages extension?
        required: true
        default: true
      publishRider:
        type: boolean
        description: publish the Rider plugin?
        required: true
        default: true

run-name:  Release ${{ inputs.majorSemver }}.${{ inputs.minorSemver }}.${{ inputs.patchSemver }} by @${{ github.actor }}
jobs:
  release:
    # Generous: this job does a pre-test build (full install.sh), the test run,
    # the Rider gradle build+publish, then another full install.sh (build + pack
    # + Blazor WASM publish + nuget push) and the VS Code publish. 10 minutes
    # routinely times out at the build-script step.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: true
    steps:
    
      - uses: actions/checkout@v4
        with: 
          ref: ${{ github.event.inputs.commit }}

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - uses: actions/setup-java@v4
        if: inputs.publishRider == true
        with:
          distribution: temurin
          java-version: '17'


      - name: pre-test setup 
        working-directory: ./FadeBasic
        run: |
          bash ./setup.sh
      - name: pre-test check 
        working-directory: ./FadeBasic
        run: |
          dotnet nuget list source
      - name: pre-test build 
        working-directory: ./FadeBasic
        run: |
          FADE_USE_LOCAL_SOURCE=true bash ./install.sh 0.0.1000 1 'LocalFade'

      - name: run tests
        working-directory: ./FadeBasic
        run: |
          dotnet nuget list source
          FADE_NUGET_VERSION='0.0.1000.1' dotnet test Tests

      - name: Run Rider Plugin Tests
        working-directory: ./Rider/fade-basic-rider
        if: inputs.publishRider == true
        run: ./gradlew test

      - name: set FADE_NUGET_DRYRUN based on input
        if: inputs.publishNuget == false
        run: echo "FADE_NUGET_DRYRUN=true" >> $GITHUB_ENV


      # Build the LSP/DAP DLLs the Rider plugin bundles. Fresh Release build
      # into a fixed dir so `-PfadeToolsDir` below picks them up regardless of
      # version — build.sln does NOT include LSP/DAP, so nothing else populates
      # a predictable net8.0 output for them before the Rider build runs.
      - name: Build Fade tools for Rider bundle
        working-directory: ./FadeBasic
        if: inputs.publishRider == true
        run: |
          dotnet build ./LSP -o "${{ runner.temp }}/fade-rider-tools" -c Release
          dotnet build ./DAP -o "${{ runner.temp }}/fade-rider-tools" -c Release

      - name: Build and Publish Rider Plugin
        working-directory: ./Rider/fade-basic-rider
        if: inputs.publishRider == true
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JETBRAINS_PLUGIN_SIGNING_CERT_CHAIN_FILE: ${{ runner.temp }}/rider-cert-chain.crt
          JETBRAINS_PLUGIN_SIGNING_KEY_FILE: ${{ runner.temp }}/rider-private-key.pem
        run: |
          echo "${{ secrets.JETBRAINS_PLUGIN_SIGNING_CERT_CHAIN }}" > "$JETBRAINS_PLUGIN_SIGNING_CERT_CHAIN_FILE"
          echo "${{ secrets.JETBRAINS_PLUGIN_SIGNING_KEY }}" > "$JETBRAINS_PLUGIN_SIGNING_KEY_FILE"
          ./gradlew buildPlugin publishPlugin -PfadeRelease=true -PfadeToolsDir="${{ runner.temp }}/fade-rider-tools" -PpluginVersion=${{ inputs.majorSemver }}.${{ inputs.minorSemver }}.${{ inputs.patchSemver }}
          rm -f "$JETBRAINS_PLUGIN_SIGNING_CERT_CHAIN_FILE" "$JETBRAINS_PLUGIN_SIGNING_KEY_FILE"

      - name: Upload Rider Plugin Artifact
        if: inputs.publishRider == true
        uses: actions/upload-artifact@v4
        with:
          name: rider-plugin
          path: Rider/fade-basic-rider/build/distributions/*.zip

      - name: Run Build Script
        working-directory: ./FadeBasic
        run: bash ./install.sh ${{ inputs.majorSemver }}.${{ inputs.minorSemver }}.${{ inputs.patchSemver }} 1 ${{ secrets.NUGET_HOST }} ${{ secrets.NUGET_API_KEY }}
        # env:
        #   FADE_NUGET_DRYRUN: true

      - name: Run VsCode Scripts
        working-directory: ./VsCode/basicscript
        if: inputs.publishVsCode == true
        run: |
          sudo chmod -R 777 out
          npm install
          npm version ${{ inputs.majorSemver }}.${{ inputs.minorSemver }}.${{ inputs.patchSemver }}
          npx vsce publish -p ${{ secrets.VS_CODE_AZURE_PAT }}

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ inputs.majorSemver }}.${{ inputs.minorSemver }}.${{ inputs.patchSemver }}
          git push origin v${{ inputs.majorSemver }}.${{ inputs.minorSemver }}.${{ inputs.patchSemver }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.majorSemver }}.${{ inputs.minorSemver }}.${{ inputs.patchSemver }}"
          NOTES=$(awk "/^\#\# \[$VERSION\]/{found=1; next} found && /^\#\# \[/{exit} found{print}" FadeBasic/CHANGELOG.md | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')
          RIDER_ZIP=$(ls Rider/fade-basic-rider/build/distributions/*.zip 2>/dev/null || true)
          if [ -n "$RIDER_ZIP" ]; then
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes "$NOTES" \
              $RIDER_ZIP
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes "$NOTES"
          fi
