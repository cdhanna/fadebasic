<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Fade WebRuntime PoC</title>
    <base href="/" />
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        textarea { width: 100%; height: 8rem; font-family: ui-monospace, monospace; }
        button { padding: 0.5rem 1rem; margin: 0.5rem 0; }
        pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; }
        #status { color: #888; font-size: 0.9rem; }
    </style>
</head>

<body>
    <nav style="margin-bottom: 1rem;"><strong>main-thread version</strong> | <a href="/worker.html">worker version</a></nav>
    <h1>Fade WebRuntime</h1>
    <p id="status">Loading .NET runtime...</p>

    <textarea id="source">print upper$("hello from fade")
print "another line"
x = rnd(100)
y = x * 2
s = str$(x)
print s</textarea>
    <br />
    <button id="run" disabled>Run</button>

    <h3>Output</h3>
    <pre id="output">(not yet run)</pre>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start().then(() => {
            document.getElementById('status').textContent = '.NET runtime ready.';
            const runBtn = document.getElementById('run');
            runBtn.disabled = false;
            runBtn.addEventListener('click', async () => {
                const src = document.getElementById('source').value;
                document.getElementById('output').textContent = 'Running...';
                try {
                    const result = await DotNet.invokeMethodAsync('WebRuntime', 'CompileAndRun', src);
                    document.getElementById('output').textContent = result;
                } catch (e) {
                    document.getElementById('output').textContent = 'JS error: ' + e;
                }
            });
        });
    </script>
</body>

</html>
