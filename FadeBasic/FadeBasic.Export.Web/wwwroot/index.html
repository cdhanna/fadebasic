<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Fade Web Export</title>
    <style>
        body { font-family: ui-monospace, Menlo, Consolas, monospace; margin: 0; background: #111; color: #ddd; min-height: 100vh; }
        header { padding: 0.5rem 1rem; background: #222; border-bottom: 1px solid #333; font-size: 0.85rem; color: #888; }
        main { padding: 1rem; }
        #output { white-space: pre-wrap; word-break: break-word; }
        #status { color: #6cf; }
        .err { color: #f66; }
    </style>
</head>
<body>
    <header><span id="status">Loading runtime…</span></header>
    <main><div id="output"></div></main>

    <script type="module">
        const statusEl = document.getElementById('status');
        const outputEl = document.getElementById('output');

        const append = (line, cls) => {
            const span = document.createElement('span');
            if (cls) span.className = cls;
            span.textContent = line + '\n';
            outputEl.appendChild(span);
        };
        const fail = (msg) => { statusEl.textContent = msg; statusEl.classList.add('err'); };

        try {
            // The game launcher uses a single VM-role worker — no LSP, no
            // debugger. Same worker.js the Playground uses; configure it as
            // 'vm' so VM_OPS like run-start / resolve-prompt are accepted.
            const worker = new Worker('worker.js', { type: 'module' });
            worker.postMessage({ type: 'configure', role: 'vm' });

            // Plugin extension point. Every library command that calls
            // HostBridge.PostMessage(channel, payload) routes through here.
            // The handler returns (or resolves to) { resultType, value };
            // the worker dispatches that to the matching Deposit* JSExport
            // which swaps the placeholder on the VM's operand stack.
            //
            // resultType strings match the FadeBasic VM primitive types:
            //   'string'  → string (heap pointer)
            //   'int'     → int32
            //   'real'    → float32
            //   'bool'    → bool
            //   'byte'    → uint8
            //   'word'    → uint16
            //   'dword'   → uint32     (use >>> 0 for unsigned)
            //   'dint'    → int64      (use BigInt past 2^53)
            //   'dfloat'  → float64
            //   'void'    → no return value
            // Pick the one matching the command's declared C# return type.
            //
            // To add a new cooperative command in a plugin library:
            //   1. The library's C# command calls HostBridge.PostMessage
            //      with its own channel name and HostBridge.SuspendVm.
            //   2. The plugin's consumer adds an entry to this map in
            //      their own index.html (or a script the page loads).
            //   3. Done. No changes to FadeBasic, FadeBasic.Export.Web,
            //      worker.js, or this index.html's framework needed.
            //
            // Exposed on window so plugin scripts loaded after this one
            // can extend the map before the worker has anything to send.
            const hostHandlers = {
                'fade-web/prompt': (payload) => ({
                    resultType: 'string',
                    value: (() => { try { return window.prompt(payload) ?? ''; }
                                    catch { return ''; } })(),
                }),
            };
            window.fadeHostHandlers = hostHandlers;

            const handleHostMessage = async (m) => {
                const handler = hostHandlers[m.channel];
                if (!handler) {
                    // Reply with an empty string so the VM doesn't hang
                    // forever. The plugin author probably forgot to
                    // register the handler in this page; surface that
                    // loudly in the console.
                    console.warn('[fade] no host handler for channel:', m.channel);
                    worker.postMessage({ type: 'host-reply', resultType: 'string', value: '' });
                    return;
                }
                try {
                    const reply = await handler(m.payload);
                    worker.postMessage({ type: 'host-reply', ...reply });
                } catch (e) {
                    console.error('[fade] host handler for', m.channel, 'threw:', e);
                    worker.postMessage({ type: 'host-reply', resultType: 'string', value: '' });
                }
            };

            const pending = new Map();
            let nextId = 0;
            const call = (msg) => new Promise((resolve) => {
                const id = ++nextId;
                pending.set(id, resolve);
                worker.postMessage({ ...msg, id });
            });

            await new Promise((resolve, reject) => {
                worker.addEventListener('message', (e) => {
                    const m = e.data;
                    if (m.type === 'ready') { resolve(); return; }
                    if (m.type === 'boot-error') { reject(new Error(m.message)); return; }
                    if (m.type === 'print') { append(m.line); return; }
                    if (m.type === 'alert') { window.alert(m.msg); return; }
                    if (m.type === 'host-message') { handleHostMessage(m); return; }
                    if (m.type === 'test-starting') {
                        // New test took over the VM. Clear the output
                        // area so each test's prints start fresh, and
                        // surface the active test's name in the status
                        // line. The Playground gets a separate
                        // test-progress event per finalized test and
                        // doesn't need this signal.
                        outputEl.innerHTML = '';
                        statusEl.textContent = 'Running ' + (m.testName ?? '…');
                        return;
                    }
                    if (m.type === 'log') { console.log('[worker]', m.message); return; }
                    if (m.type === 'heartbeat') return;
                    if (m.id != null && pending.has(m.id)) {
                        const cb = pending.get(m.id);
                        pending.delete(m.id);
                        cb(m);
                    }
                });
            });

            // Preview mode: the Playground (or any host driving this page
            // from a parent window) sets ?preview=1 and posts a `bootstrap`
            // message instead of relying on fade-manifest.json + game/*.dll.
            // The bootstrap payload carries the compiled bytecode and a list
            // of command-DLL fetch entries the iframe should load before
            // running. We tell the parent we're ready, then await its post.
            const isPreview = new URLSearchParams(location.search).has('preview');
            const isRegularExport = !isPreview;

            // Shared run helper: tell the worker to start the pump and
            // surface the terminal result. Used by both the regular-export
            // path (entry DLL via run-start) and the preview path
            // (bytecode via run-start-bytecode).
            const runOnce = async (kickoff) => {
                statusEl.textContent = 'Running…';
                const result = await call(kickoff);
                let parsed; try { parsed = JSON.parse(result.result); } catch { parsed = {}; }
                if (parsed.ok) statusEl.textContent = 'Done.';
                else {
                    statusEl.textContent = parsed.compileError ? 'Compile error' : 'Runtime error';
                    if (parsed.compileError) append(parsed.compileError, 'err');
                    if (parsed.error) append(parsed.error, 'err');
                }
            };

            if (isRegularExport) {
                statusEl.textContent = 'Loading game…';

                const manifest = await fetch('fade-manifest.json').then(r => r.json());
                const entryName = manifest.entryAssembly;
                if (!entryName) throw new Error('fade-manifest.json missing entryAssembly');

                // Pre-load every dep DLL in game/ before the entry assembly so
                // resolving the entry's ILaunchable doesn't fail on missing refs.
                // manifest.deps is authoritative — no directory listing on static
                // hosts. Targets writes it from $(OutDir)*.dll minus the entry.
                const deps = Array.isArray(manifest.deps) ? manifest.deps : [];
                for (const dep of deps) {
                    if (dep === entryName) continue;
                    try {
                        const bytes = await fetch(`game/${dep}`).then(r => r.arrayBuffer());
                        const r = await call({ type: 'load-assembly', dllBytes: bytes });
                        const parsed = JSON.parse(r.result);
                        if (!parsed.ok) append(`[warn] load ${dep}: ${parsed.error}`, 'err');
                    } catch (e) {
                        append(`[warn] load ${dep}: ${e.message}`, 'err');
                    }
                }

                // exports compiled directly to bytecode (Playground-style
                // exports) ship a `bytecode` filename + `commandDlls` list
                // instead of an entryAssembly. Detect either shape so both
                // export flavors run from the same index.html.
                if (manifest.bytecode) {
                    const cmds = Array.isArray(manifest.commandDlls) ? manifest.commandDlls : [];
                    for (const c of cmds) {
                        try {
                            const bytes = await fetch(`game/${c.assembly}.dll`).then(r => r.arrayBuffer());
                            const r = await call({ type: 'register-command-assembly',
                                dllBytes: bytes, className: c.class });
                            const parsed = JSON.parse(r.result);
                            if (!parsed.ok) append(`[warn] register ${c.assembly}: ${parsed.error}`, 'err');
                        } catch (e) {
                            append(`[warn] register ${c.assembly}: ${e.message}`, 'err');
                        }
                    }
                    const bytecode = await fetch(`game/${manifest.bytecode}`).then(r => r.arrayBuffer());
                    await runOnce({ type: 'run-start-bytecode', bytecode });
                } else {
                    const entryBytes = await fetch(`game/${entryName}`).then(r => r.arrayBuffer());
                    await runOnce({ type: 'run-start', dllBytes: entryBytes });
                }
            } else {
                // Preview mode: parent window owns the source-of-truth.
                // Boot order:
                //   1. Parent posts `bootstrap` with command DLLs only.
                //      Iframe registers each one; iframe is now "armed."
                //   2. Parent posts run / debug / tests / compile commands
                //      via the same postMessage channel. Iframe relays
                //      each to its worker. Worker replies are relayed
                //      back to the parent. Internal events (print, alert,
                //      host-message) stay in the iframe so the user sees
                //      output and dialogs in this window — the parent
                //      gets them too via the rebroadcast below so the
                //      Output panel can mirror them.
                statusEl.textContent = 'Waiting for bootstrap…';

                let armed = false;
                // True while the iframe is making its own register-command-
                // assembly calls during bootstrap. The worker→parent relay
                // suppresses id-carrying messages during this window so the
                // iframe's internal handshake doesn't race into the parent's
                // pending-promise map (the two windows have independent id
                // counters that overlap from 1).
                let bootstrapping = false;
                const onBootstrap = async (data) => {
                    bootstrapping = true;
                    try {
                        outputEl.innerHTML = '';
                        statusEl.textContent = 'Registering libraries…';
                        for (const c of (data.commandDlls || [])) {
                            const r = await call({
                                type: 'register-command-assembly',
                                dllBytes: c.bytes, className: c.class,
                            });
                            const parsed = JSON.parse(r.result);
                            if (!parsed.ok) append(`[warn] register ${c.assembly}: ${parsed.error}`, 'err');
                        }
                    } finally {
                        bootstrapping = false;
                    }
                    armed = true;
                    statusEl.textContent = 'Ready.';
                    try { window.parent.postMessage({ type: 'preview-armed' }, '*'); }
                    catch { /* parent may be cross-origin */ }
                };

                // Worker → parent relay. Events the iframe consumes
                // internally for its render surface (print, alert,
                // host-message → window.prompt, etc.) STAY in the iframe
                // so the user sees them where the game is. Everything
                // else — id-correlated results (run-tick-result,
                // debug-*-result, run-tests-result, compile-to-bytecode-
                // result), streaming events (debug-event), boot-error
                // diagnostics — is forwarded to the parent so the
                // Playground's UI can react.
                const internalOnly = new Set([
                    'ready', 'boot-error',
                    'print', 'alert', 'host-message',
                    'log', 'heartbeat',
                    // test-starting is a UI hint just for the iframe
                    // (clear output between tests). The Playground
                    // consumes per-test state via test-progress; sending
                    // test-starting along would be noise.
                    'test-starting',
                ]);
                worker.addEventListener('message', (e) => {
                    const m = e.data;
                    if (!m || internalOnly.has(m.type)) return;
                    // Suppress id-carrying replies during bootstrap — they
                    // resolve the iframe's own `call()` pending entries
                    // and would spuriously match the parent's pending map
                    // (independent id counters that overlap from 1).
                    if (bootstrapping && m.id != null) return;
                    try { window.parent.postMessage(m, '*'); } catch { }
                });

                // Parent → worker / parent → iframe relay. Bootstrap is
                // handled here; everything else is forwarded to the
                // worker as-is. Run-start messages reset the visible
                // output so the user sees a clean slate per run.
                const resetOnEntry = new Set([
                    'run-start-source', 'run-start-bytecode', 'run-start',
                    'debug-start', 'debug-start-test', 'run-tests',
                ]);
                window.addEventListener('message', (e) => {
                    if (e.source !== window.parent) return;
                    const m = e.data;
                    if (!m) return;
                    if (m.type === 'bootstrap') { onBootstrap(m); return; }
                    if (!armed) {
                        // Surface a clear error rather than silently dropping —
                        // a parent message before bootstrap is a programming
                        // bug worth catching.
                        console.warn('[preview] message before bootstrap:', m.type);
                        return;
                    }
                    if (resetOnEntry.has(m.type)) {
                        outputEl.innerHTML = '';
                        statusEl.textContent = 'Running…';
                    }
                    worker.postMessage(m);
                });

                // Tell the parent we're ready for the bootstrap message.
                try { window.parent.postMessage({ type: 'preview-ready' }, '*'); }
                catch { /* parent may be cross-origin; that's OK */ }
            }
        } catch (e) {
            fail('Failed: ' + (e?.message ?? e));
            console.error(e);
        }
    </script>
</body>
</html>
